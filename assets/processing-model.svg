<title id="title">Accounting automation processing model</title>
<desc id="desc">Financial inputs are normalized and checked against explicit rules. Unresolved cases may receive AI assistance and human review. All proposed entries are validated. Complete results produce ERP output; incomplete results remain pending.</desc>
